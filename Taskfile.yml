version: '3'

vars:
  ENVIRONMENT: "DEVELOPMENT2"
  DB_URL: "postgresql://postgres:1234@localhost:5432/postgres"
  GO_BIN:
    sh: go env GOPATH
  GOOSE_DRIVER: postgres
  GOOSE_DBSTRING: "{{.DB_URL}}"
  GOOSE_MIGRATION_DIR: ./db/migrations/
  API_BIN_NAME:
    sh: |
      if [ "{{.OS}}" = "Windows_NT" ]; then
        echo "bin/Am.EventKit.api.exe"
      else
        echo "bin/Am.EventKit.api"
      fi
  MCP_BIN_NAME:
    sh: |
      if [ "{{.OS}}" = "Windows_NT" ]; then
        echo "bin/Am.EventKit.mcp.exe"
      else
        echo "bin/Am.EventKit.mcp"
      fi

tasks:
  setup:
    desc: "Install CLI tools and setup development environment"
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/evilmartians/lefthook@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - lefthook install
      - echo "All CLI tools installed successfully in {{.GO_BIN}}/bin"

  api:
    desc: "Run the development server with hot reload (API)"
    cmds:
      - air -c .air.api.toml

  mcp:
    desc: "Run the MCP server with hot reload"
    cmds:
      - air -c .air.mcp.toml

  dev-all:
    desc: "Run both API and MCP servers with hot reload"
    cmds:
      - task: dev
      - task: dev-mcp

  build:
    desc: "Build both API and MCP applications"
    deps: [build-api, build-mcp]

  build-api:
    desc: "Build the API application"
    cmds:
      - go mod tidy
      - go fmt ./...
      - go build -o {{.API_BIN_NAME}} -ldflags "-X main.mode=api" main.go

  build-mcp:
    desc: "Build the MCP application"
    cmds:
      - go mod tidy
      - go fmt ./...
      - go build -o {{.MCP_BIN_NAME}} -ldflags "-X main.mode=mcp" main.go

  run:
    desc: "Build and run the API application"
    deps: [build-api]
    cmds:
      - ./{{.API_BIN_NAME}}

  run-mcp:
    desc: "Build and run the MCP application"
    deps: [build-mcp]
    cmds:
      - ./{{.MCP_BIN_NAME}}

  run-all:
    desc: "Build and run both API and MCP applications"
    deps: [build]
    cmds:
      - ./{{.API_BIN_NAME}} &
      - ./{{.MCP_BIN_NAME}}

  up:
    desc: "Run all database migrations"
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} {{.GOOSE_DRIVER}} {{.GOOSE_DBSTRING}} up

  upone:
    desc: "Run one database migration at a time"
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} {{.GOOSE_DRIVER}} {{.GOOSE_DBSTRING}} up-by-one

  seed:
    desc: "Seed the database with test data (DEVELOPMENT environment only)"
    deps: [build]
    cmds:
      - |
        if [ "{{.ENVIRONMENT}}" = "DEVELOPMENT" ]; then
          go run seed/seed.go seed/truncate.go seed/main.go -s
        else
          echo "Skipping seed: not in DEVELOPMENT environment."
        fi

  down:
    desc: "Reset all database migrations"
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} {{.GOOSE_DRIVER}} {{.GOOSE_DBSTRING}} reset

  downto:
    desc: "Migrate down to a specific version"
    vars:
      VERSION: "{{.v | default \"0\"}}"
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} {{.GOOSE_DRIVER}} {{.GOOSE_DBSTRING}} down-to {{.VERSION}}

  status:
    desc: "Show migration status"
    cmds:
      - goose -dir {{.GOOSE_MIGRATION_DIR}} {{.GOOSE_DRIVER}} {{.GOOSE_DBSTRING}} status

  clean:
    desc: "Clean database data"
    cmds:
      - go run seed/seed.go seed/truncate.go seed/main.go -c
