version: "2"

sql:
  - engine: "postgresql"
    queries: "internal/datarepo/queries"
    schema: 
      - migrations
    gen:
      go:
        emit_interface: true
        emit_empty_slices: true
        emit_methods_with_db_argument: true
        emit_json_tags: true
        package: "datarepo"
        out: "internal/datarepo/gen"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestampz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"

