services:

  postgres:
    image: postgres:17-alpine
    container_name: anokha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    restart: on-failure
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  drizzle-gate:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: anokha-drizzle-gateway
    environment:
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/postgres
      STORE_PATH: /app
    restart: on-failure
    depends:
      - postgres
    ports:
      - "4983:4983"
    volumes:
      - drizzle_gateway_data:/app
    networks:
      - app_network

