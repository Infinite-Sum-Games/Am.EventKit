  #   ports:
  #     - "9187:9187"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - app_network
  #     - monitoring_network
  
  # Prometheus
  #   image: prom/prometheus:v2.52.0
  #   container_name: anokha-prometheus
  #   restart: on-failure
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
  #   networks:
  #     - monitoring_network
  #   extra_hosts:
  #     - "anokha-backend-host:host-gateway" 
  #
  # grafana:
  #   image: grafana/grafana:11.0.0
