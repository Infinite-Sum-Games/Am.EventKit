  #   restart: on-failure
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - monitoring_network

  # Workflow management with RabbitMQ
  rabbitmq:
    image: rabbitmq:4.1.5-management-alpine
    container_name: anokha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - "5672:5672"
      - "15672:15672"

networks:
  app_network:
    driver: bridge
  valkey_network:
    driver: bridge

volumes:
  postgres_data:
  drizzle_gateway_data:
  valkey_data:
