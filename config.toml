[app]
env = "DEVELOPMENT"
port = 8080
mcp_port = 8081
client_domain = "http://localhost:3000"
cookie_domain = "localhost"
cookie_secure = true

[database]
url = "postgres://postgres:1234@localhost:5432/postgres"
pool_max_conns = 450
pool_min_conns = 10
pool_max_conn_lifetime = "1h"
pool_max_conn_idle_time = "30m"
health_check_period = "1m"
connect_timeout = "60s"

[olap]

[redis]
host = "localhost"
port = "6379"
username = ""
password = ""
db = 0
protocol = 3
dial_timeout = "5s"
read_timeout = "3s"
write_timeout = "5s"

[rabbitmq]
url = "amqp://localhost:5672"
exchange = "" # Default
queue_durable = true
queue_auto_delete = false
prefetch_count = 10
reconnect_delay = "5s"
max_reconnect_attempts = 5

[mailer]
host = "smtp.host.name"
port = 56
username = ""
password = ""

[payment]
payu_test_key = ""
payu_test_salt = ""
payu_prod_key = ""
payu_prod_salt = ""
payu_test_verify_url = ""
payu_prod_verify_url = ""

[flagsmith]
api_url = "http://localhost:8080/api/v1/"
environment_key = "ser:default-to-enabled-key-change-me"
request_timeout = 10
refresh_interval = 60
default_to_enabled = true

[opentelemetry]
service_name = "am.eventkit"
service_version = "1.0.0"
environment = "development"
endpoint = "localhost:4317"
insecure = true
enabled = true
