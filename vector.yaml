sources:
  dev_logs:
    type: file
    include:
      - /logs/dev.log         # Path inside container
    fingerprinting:
      strategy: device_and_inode
    read_from: beginning

  prod_logs:
    type: file
    include:
      - /logs/prod.log        # Path inside container
    fingerprinting:
      strategy: device_and_inode
    read_from: beginning

transforms:
  dev_logfmt:
    type: remap
    inputs: [dev_logs]
    source: |
      . |= parse_key_value!(.message)
      .log_filename = "dev.log"

  prod_logfmt:
    type: remap
    inputs: [prod_logs]
    source: |
      . |= parse_key_value!(.message)
      .log_filename = "prod.log"

sinks:
  loki:
    type: loki
    inputs: [dev_logfmt, prod_logfmt]
    endpoint: http://loki:3100    
    encoding:
      codec: json
    labels:
      filename: "{{log_filename}}"
      level: "{{level}}"           
      source: "vector"
    batch:
      max_bytes: 1048576
      timeout_secs: 5
