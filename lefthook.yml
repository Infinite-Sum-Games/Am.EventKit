pre-commit:
  parallel: true
  commands:
    # 1. Block fmt.Println and fmt.Printf usage
    prevent-fmt-println:
      glob: "*.go"
      run: |
        if grep -nE 'fmt\.Print(ln|f)' {staged_files}; then
          echo "Error: Found 'fmt.Println' or 'fmt.Printf' in staged Go files."
          echo "Please use structured logging (zerolog) instead."
          exit 1
        fi
    # 3. Fail if any file is not gofmt formatted
    go-fmt:
      glob: "*.go"
      run: |
        UNFORMATTED=$(gofmt -l {staged_files})
        if [ -n "$UNFORMATTED" ]; then
          echo "Detected unformatted files. Running gofmt..."
          gofmt -w {staged_files}
          git add {staged_files}
          echo "gofmt applied and changes staged."
        fi
    # 4. Run tests if *_test.go exists
    go-test:
      run: ./scripts/go-test.sh